name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libgl1-mesa-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test the binary
        run: |
          ./target/release/ollama-deck --version
          ./target/release/ollama-deck --help

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ollama-deck dist/
          cp README.md LICENSE install.sh get.sh dist/
          cp -r assets dist/
          tar -C dist -czf ollama-deck-linux-x86_64.tar.gz .
          sha256sum ollama-deck-linux-x86_64.tar.gz > ollama-deck-linux-x86_64.tar.gz.sha256
          ls -lh ollama-deck-linux-x86_64.tar.gz*

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-deck-linux-x86_64
          path: |
            ollama-deck-linux-x86_64.tar.gz
            ollama-deck-linux-x86_64.tar.gz.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ollama-deck-linux-x86_64.tar.gz
            ollama-deck-linux-x86_64.tar.gz.sha256
