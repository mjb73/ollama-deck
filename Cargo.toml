[package]
name = "ollama-deck"
version = "0.1.4"
edition = "2021"
description = "A small desktop console for loading, unloading and watching Ollama models on Linux"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
